<div class="login-component">
    <mat-card>
        <img [src]="logoForm" alt="Imagem da Logotipo">
        <mat-card-header class="padding-m">
            <mat-card-title>Entrar</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email">
                </mat-form-field>

                <mat-form-field class="full-width">
                    <mat-label>Senha</mat-label>
                    <input matInput type="password" formControlName="senha">
                </mat-form-field>
            </form>
        </mat-card-content>

        <mat-card-actions>
            <button matButton="outlined" class="full-width" [disabled]="form.invalid || isLoading" (click)="submit()">
                <span class="cad-button-content">
                    {{ isLoading ? "Entrando..." : "Entrar" }}
                    @if (isLoading) {<mat-spinner diameter="20"></mat-spinner>}
                </span>
                </button>
        </mat-card-actions>
    </mat-card>
</div>
