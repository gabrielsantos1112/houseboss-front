<div class="register-component">
    <mat-card>
        <img src="/img/Logotipo House Boss Barberaria.png" alt="Imagem da Logotipo">
        <mat-card-header class="padding-m">
            <mat-card-title >Cadastre a sua conta</mat-card-title>
            <mat-card-subtitle>Todo o Boss começa aqui!</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field class="full-width">
                <mat-label>Nome</mat-label>
                <input matInput>
            </mat-form-field>
            <mat-form-field class="full-width">
                <mat-label>Email</mat-label>
                <input matInput>
            </mat-form-field>
            <mat-form-field class="full-width">
                <mat-label>Senha</mat-label>
                <input matInput>
            </mat-form-field>
        </mat-card-content>

        <mat-card-actions>
            <button matButton="outlined" class="full-width">Cadastrar</button>
        </mat-card-actions>
    </mat-card>
</div>
